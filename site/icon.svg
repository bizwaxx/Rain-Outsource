<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Rain-Outsource: rain cloud over a playing field</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b4a7f"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fae5f"/>
      <stop offset="1" stop-color="#1a8a4a"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- field -->
    <path d="M-20 392 Q256 312 532 392 L532 532 L-20 532 Z" fill="url(#grass)"/>
    <!-- infield diamond (chalk) -->
    <path d="M256 360 L330 410 L256 460 L182 410 Z" fill="#c98b4a" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <!-- rain -->
    <g fill="#5ab8ff">
      <path d="M166 236 q-30 46 0 64 q30 -18 0 -64 z"/>
      <path d="M256 252 q-30 46 0 64 q30 -18 0 -64 z"/>
      <path d="M346 236 q-30 46 0 64 q30 -18 0 -64 z"/>
    </g>
    <!-- cloud -->
    <path d="M136 222 a56 56 0 0 1 12 -110 a84 84 0 0 1 158 -26 a64 64 0 0 1 86 60 a46 46 0 0 1 -6 76 Z" fill="#ffffff"/>
  </g>
</svg>
