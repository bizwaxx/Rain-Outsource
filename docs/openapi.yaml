openapi: 3.0.3
info:
  title: Rainout Source API
  version: 0.12.0
  description: Agent-readable field and rainout status API for outdoor games and events. The Austin pilot now supports Krieg/Craig, Havins, and an Austin metro public/private expansion batch with live National Weather Service game-time weather (cached, with an Open-Meteo fallback), conservative official source polling, and stricter outside-agent answer requirements. Also covers 10 motocross tracks (TX, FL, OK) with race calendars, riding odds and rain history, and a worldwide rain-chance lookup. Users can report cancellations (/v1/reports); recent unverified reports adjust the odds while the official status is unknown.
  x-creator: JEEZ Labs
servers:
  - url: https://rainout-agent-source.vercel.app
    description: Live production backend
  - url: http://127.0.0.1:8000
    description: Local development backend
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check for the Rainout Source backend.
      responses:
        "200":
          description: Backend is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: rainout-source
                  weather_cache:
                    type: object
                    description: Active weather cache backend (local server and /health only). Never includes URLs or tokens.
                    properties:
                      backend:
                        type: string
                        example: memory+upstash
  /v1/fields:
    get:
      operationId: listFields
      summary: List or search venues (hand-verified plus nationwide OpenStreetMap venues).
      description: >-
        Discover field IDs, status URLs and official rainout sources before asking for status. Without q or near
        this lists the hand-verified ("confirmed") venues. Search with q (name) and/or near (lat,lon) to include
        tens of thousands of OpenStreetMap venues (verification_level "osm_only": community map data, no official
        status source; map data (c) OpenStreetMap contributors, ODbL). OSM venues need state, q or near.
      parameters:
        - in: query
          name: sport
          required: false
          schema:
            type: string
          description: "Comma-separated sports: baseball, softball, soccer, motocross, multipurpose (aliases: baseball_softball, mx)."
          example: soccer
        - in: query
          name: state
          required: false
          schema:
            type: string
          description: Comma-separated two-letter US state codes.
          example: TX,OK
        - {in: query, name: q, required: false, schema: {type: string, maxLength: 120}, description: Venue name search., example: Lamar Park}
        - {in: query, name: near, required: false, schema: {type: string}, description: "lat,lon to search around.", example: "30.27,-97.74"}
        - {in: query, name: radius_km, required: false, schema: {type: number, minimum: 1, maximum: 200, default: 25}}
        - {in: query, name: verification, required: false, schema: {type: string, enum: [confirmed, osm_only, all]}, description: "Default: all when q or near is given, otherwise confirmed."}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 500}, description: "Default 100 (25 when searching)."}
        - {in: query, name: offset, required: false, schema: {type: integer, minimum: 0}}
      responses:
        "400":
          description: Invalid sport or state filter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_filter
                  message:
                    type: string
                  allowed_sports:
                    type: array
                    items:
                      type: string
        "200":
          description: Supported field directory
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - creator
                  - count
                  - fields
                properties:
                  service:
                    type: string
                    example: rainout-source
                  creator:
                    type: string
                    example: JEEZ Labs
                  count:
                    type: integer
                    example: 6
                  filters:
                    type: object
                    description: Echo of the sport/state filters applied (omitted when unfiltered).
                  fields:
                    type: array
                    items:
                      type: object
                      required:
                        - field_id
                        - name
                        - aliases
                        - status_url
                      properties:
                        field_id:
                          type: string
                          example: austin-tx-havins-softball-complex
                        name:
                          type: string
                          example: Havins Softball Complex
                        city:
                          type: string
                          example: Austin
                        state:
                          type: string
                          example: TX
                        address:
                          type: string
                          example: 12138 N Lamar Blvd, Austin, TX 78753
                        sport:
                          type: string
                          example: softball
                        sports:
                          type: array
                          items:
                            type: string
                            enum: [baseball, softball, soccer, motocross, multipurpose]
                          example: [softball]
                        venue_type:
                          type: string
                          enum: [ball_field, soccer_complex, motocross_track, multipurpose_field]
                        coordinates:
                          type: object
                          properties:
                            lat:
                              type: number
                            lon:
                              type: number
                        operator:
                          type: string
                          nullable: true
                          description: Operator, owner or league; null when not verified.
                        surface:
                          type: string
                          enum: [grass, artificial_turf, dirt, grass_with_dirt_infield, mixed, unknown]
                        drainage:
                          type: string
                          enum: [poor, average, good, unknown]
                        rainout_phone:
                          type: string
                          example: 512-978-2680
                        ownership_type:
                          type: string
                          example: public
                        status_source_type:
                          type: string
                          example: official_county_park_page
                        aliases:
                          type: array
                          items:
                            type: string
                          example: [Havins, Havins Complex, Havins Softball, austin-tx-havins-softball-complex]
                        weather_source:
                          type: string
                          example: National Weather Service API
                        official_status_source_url:
                          type: string
                          example: https://www.austintexas.gov/department/athletics
                        official_status_source_name:
                          type: string
                          example: Austin Parks and Recreation Athletics page
                        status_url:
                          type: string
                          example: https://rainout-agent-source.vercel.app/v1/status?field_id=Havins&game_time={ISO-8601-game-time}
  /v1/status:
    get:
      operationId: getGameStatus
      summary: Get official status, rain chance, and game-time play probability for a field/game.
      description: >-
        Weather comes from the National Weather Service (cached for about 10 minutes; a cached copy
        up to 2 hours old is used if NWS is down) or, as a last resort, Open-Meteo. `weather_source_id`
        says which one was used. Responses carry Cache-Control (max-age 60 s; 30 s when degraded).
      parameters:
        - in: query
          name: field_id
          required: true
          schema:
            type: string
          description: Field ID or supported alias. Current aliases include Krieg, Craig, Havins, Northeast Metro, Southeast Metro, Oak Hill Youth Sports, Manchaca Optimist, T&C Sports, Balcones, NWLL, and Western Hills.
          example: Havins
        - in: query
          name: game_time
          required: true
          schema:
            type: string
          example: "2026-06-06T20:20:00-05:00"
      responses:
        "200":
          description: Agent-readable status result
          content:
            application/json:
              schema:
                type: object
                required:
                  - field
                  - official_status
                  - rain_chance_percent
                  - game_time_play_probability_percent
                  - source
                  - spoken_answer
                properties:
                  creator:
                    type: string
                    example: JEEZ Labs
                  field:
                    type: string
                  field_id:
                    type: string
                  address:
                    type: string
                  official_status:
                    type: string
                    enum: [on, cancelled, delayed, field_closed, unknown]
                  official_status_source_url:
                    type: string
                  official_status_source_name:
                    type: string
                  official_status_checked:
                    type: boolean
                    description: True when Rainout Source checked the official source page for this request.
                  official_status_last_checked:
                    type: string
                    nullable: true
                    description: ISO-8601 timestamp for the official source check when available.
                  rain_chance_percent:
                    type: integer
                    minimum: 0
                    maximum: 100
                  thunderstorm_likely:
                    type: boolean
                  game_time_play_probability_percent:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: >-
                      Estimated chance the game is played. Cancelled/closed = 0. Official "on" = 100 minus the
                      (NOAA-calibrated) rain chance. Unknown (nothing posted) = 96% baseline lowered by rain and
                      storms (dry ~96, 70% rain ~40-55, thunderstorms <= 50). Delayed or conflicting signals <= 50.
                      See docs/play-probability.md.
                  risk_level:
                    type: string
                    description: Weather risk when status is on (low, medium, high); "unknown" when the official status is unknown or uncertain; "officially cancelled" when cancelled.
                  reason:
                    type: string
                    description: Plain-language explanation of the play probability.
                  recommendation:
                    type: string
                    enum: [likely_safe_to_drive, check_again_before_leaving, do_not_drive, check_official_source]
                  source:
                    type: string
                  weather_source:
                    type: string
                    description: Human-readable weather source.
                    example: National Weather Service API
                  weather_source_id:
                    type: string
                    enum: [nws, nws_stale, open_meteo]
                    description: nws = NWS (live or fresh cache); nws_stale = cached NWS served because NWS failed; open_meteo = Open-Meteo fallback.
                  weather_cache:
                    type: string
                    nullable: true
                    enum: [hit, miss, stale]
                    description: Whether the forecast came from the Rainout Source cache.
                  last_checked:
                    type: string
                    nullable: true
                    description: When the forecast used was fetched from its source (ISO-8601, UTC).
                  spoken_answer:
                    type: string
                  answer_requirements:
                    type: object
                    description: Required wording outside agents must include in the final user-facing answer.
                  historical_calibration:
                    type: object
                    nullable: true
                    description: >-
                      NOAA GHCN-Daily rain history used to calibrate play probability for the game month.
                      Null when the field has no NOAA history yet. Additive; does not change other fields.
                    properties:
                      source:
                        type: string
                      station_id:
                        type: string
                        example: USW00013904
                      station_name:
                        type: string
                        example: AUSTIN BERGSTROM INTL AP
                      station_distance_km:
                        type: number
                      period:
                        type: object
                        properties:
                          start:
                            type: string
                          end:
                            type: string
                      month:
                        type: string
                        example: "05"
                      rain_to_cancel_threshold_in:
                        type: number
                        description: Daily rain total (inches) treated as rainout-level for this field.
                      rainy_day_share_reaching_threshold:
                        type: number
                        description: Share of rainy days (>= 0.01 in) in this month that reached the threshold.
                      rainout_level_day_frequency:
                        type: number
                        description: Share of all days in this month that reached the threshold.
                      rain_severity_applied:
                        type: number
                        nullable: true
                        description: Multiplier applied to the rain chance (1.0 = rain chance counts fully).
                  community_reports:
                    $ref: '#/components/schemas/CommunityReportSummary'
              example:
                creator: JEEZ Labs
                field: Havins Softball Complex
                field_id: austin-tx-havins-softball-complex
                address: 12138 N Lamar Blvd, Austin, TX 78753
                official_status: unknown
                official_status_source_url: https://www.austintexas.gov/department/athletics
                official_status_source_name: Austin Parks and Recreation Athletics page
                official_status_checked: true
                official_status_last_checked: "2026-06-06T19:10:00+00:00"
                rain_chance_percent: 16
                thunderstorm_likely: true
                game_time_play_probability_percent: 50
                recommendation: check_again_before_leaving
                source: "Rainout phone: 512-978-2680; weather: National Weather Service"
                spoken_answer: "Official rainout status is unknown for Havins Softball Complex. At game time, 8:20 PM, rain chance is 16% with storms possible. Estimated play probability is 50%. Please call 512-978-2680 before leaving."
                answer_requirements:
                  must_include: [field name, official status, rain chance, play probability, rainout phone or official source]
                  if_official_status_unknown: "Say official status is unknown and tell the user to call 512-978-2680 before leaving."
  /v1/reports:
    post:
      operationId: reportCancellation
      summary: Report what you see at a field (cancelled, delayed, field closed or playing).
      description: >-
        Stores an anonymous, unverified report in the server cache for 24 hours (in memory per instance by
        default, or a shared Upstash/Vercel KV cache when configured). Reports from the last 12 hours for the
        same local game date adjust `game_time_play_probability_percent` in /v1/status while the official
        status is unknown; a known official status always wins. Rate limits per client: 3 reports per field
        and 10 in total per hour (429 with Retry-After).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_id, status]
              properties:
                field_id:
                  type: string
                  description: Venue field_id (or alias) from /v1/fields.
                status:
                  type: string
                  enum: [cancelled, delayed, field_closed, playing]
                  description: Aliases such as rained_out, postponed, closed and on are accepted.
                game_time:
                  type: string
                  format: date-time
                  description: Game start with UTC offset, from 12 hours ago to 36 hours ahead. Defaults to now.
                note:
                  type: string
                  maxLength: 280
            example:
              field_id: austin-tx-krieg-field-softball-complex
              status: cancelled
              game_time: "2026-06-05T19:00:00-05:00"
              note: Umpires called it at 6:40.
      responses:
        "201":
          description: Report stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  report:
                    $ref: '#/components/schemas/CancellationReport'
                  recent:
                    $ref: '#/components/schemas/CommunityReportSummary'
                  storage:
                    type: object
        "400":
          description: Invalid input (error is missing_field_id, invalid_status, invalid_game_time, game_time_out_of_range, note_too_long, ...).
        "404":
          description: Unknown field_id.
        "413":
          description: Body over 4 KB.
        "429":
          description: Rate limited; see Retry-After.
    get:
      operationId: listCancellationReports
      summary: Recent reports for one field (last 24 hours, newest first, up to 20).
      parameters:
        - name: field_id
          in: query
          required: true
          schema:
            type: string
        - name: game_time
          in: query
          required: false
          description: Only reports for this game's local date.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Recent reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_id:
                    type: string
                  summary:
                    $ref: '#/components/schemas/CommunityReportSummary'
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/CancellationReport'
        "404":
          description: Unknown field_id.
  /v1/schedule/check:
    get:
      operationId: checkScheduleByUrl
      summary: Check an ICS calendar (by URL) for games likely to be rained out.
      description: >-
        Fetches the calendar (http/https/webcal only, public hosts only, 1 MB, 8 s), matches each
        event to a venue, scores play probability with the NWS forecast plus NOAA history and flags
        at-risk games. Stateless. See docs/schedule.md.
      parameters:
        - {in: query, name: ics_url, required: true, schema: {type: string, format: uri}, example: "https://example.org/team.ics"}
        - {in: query, name: format, required: false, schema: {type: string, enum: [json, ics], default: json}}
        - {in: query, name: risk_threshold, required: false, schema: {type: integer, minimum: 0, maximum: 100, default: 60}}
        - {in: query, name: days, required: false, schema: {type: integer, minimum: 1, maximum: 31, default: 14}}
        - {in: query, name: venue, required: false, schema: {type: string}, description: Venue id/alias for events whose location cannot be matched.}
        - {in: query, name: timezone, required: false, schema: {type: string}, description: IANA zone for floating times when no venue matches.}
      responses:
        "200":
          description: Schedule report (JSON) or annotated calendar (format=ics)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleReport"}
            text/calendar:
              schema: {type: string}
        "400": {description: "missing_schedule, invalid_schedule, invalid_format or unsafe_url", content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleError"}}}}
        "502": {description: ics_fetch_failed, content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleError"}}}}
    post:
      operationId: checkSchedule
      summary: Check an uploaded schedule (JSON games, raw ICS or CSV).
      description: Same options as GET, as query parameters or JSON keys. Body limit 1 MB.
      parameters:
        - {in: query, name: format, required: false, schema: {type: string, enum: [json, ics], default: json}}
        - {in: query, name: risk_threshold, required: false, schema: {type: integer, default: 60}}
        - {in: query, name: days, required: false, schema: {type: integer, default: 14}}
        - {in: query, name: venue, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    games: {type: array, items: {$ref: "#/components/schemas/ScheduleGameInput"}}
                    ics: {type: string, description: Raw iCalendar text}
                    csv: {type: string, description: CSV with a header row}
                    ics_url: {type: string, format: uri}
                    format: {type: string, enum: [json, ics]}
                    risk_threshold: {type: integer}
                    days: {type: integer}
                    venue: {type: string}
                    timezone: {type: string}
                - type: array
                  items: {$ref: "#/components/schemas/ScheduleGameInput"}
            example:
              games:
                - {venue: Krieg, start: "2026-05-09T19:00:00-05:00", home: Hawks, away: Bats}
                - {venue: Onion Creek Soccer Complex, date: "2026-05-10", time: "9:00 AM", teams: Red vs Blue}
          text/calendar:
            schema: {type: string}
          text/csv:
            schema: {type: string}
            example: "venue,date,time,home,away\nKrieg,2026-05-09,19:00,Hawks,Bats\n"
      responses:
        "200":
          description: Schedule report (JSON) or annotated calendar (format=ics)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleReport"}
            text/calendar:
              schema: {type: string}
        "400": {description: "invalid_json, invalid_schedule, invalid_format, missing_schedule or unsafe_url", content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleError"}}}}
        "413": {description: payload_too_large, content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleError"}}}}
        "502": {description: ics_fetch_failed, content: {application/json: {schema: {$ref: "#/components/schemas/ScheduleError"}}}}
  /v1/teams/search:
    get:
      operationId: searchTeams
      summary: Find a user's team in public league schedules.
      description: >-
        Find the user's team (e.g. "ATX Boys, Friday nights at Craig Fields"). Confirm the match with the user.
        If next_step is ask_user_for_schedule_url, ask for their league schedule link and retry with schedule_url.
      parameters:
        - {in: query, name: q, required: false, schema: {type: string, maxLength: 120}, description: Team name as the user said it., example: ATX Boys}
        - {in: query, name: venue, required: false, schema: {type: string}, description: Venue name or alias (e.g. Craig Fields)., example: Craig Fields}
        - {in: query, name: sport, required: false, schema: {type: string}, example: softball}
        - {in: query, name: day, required: false, schema: {type: string}, description: Weekday they usually play., example: friday}
        - {in: query, name: schedule_url, required: false, schema: {type: string, format: uri}, description: "League schedule link from the user (ICS/webcal feed or schedule web page). Public http(s) only."}
      responses:
        "200":
          description: Candidate teams (may be empty)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamSearchResult"}
        "400":
          description: Missing query or unsafe schedule_url
          content: {application/json: {schema: {$ref: "#/components/schemas/TeamsError"}}}
  /v1/teams/{team_id}/games:
    get:
      operationId: getTeamGames
      summary: A team's games with play odds, a spoken reason, and a ready-to-add calendar event.
      description: >-
        Use date=today for "do I have a game today?". Read reason aloud. Never add to a calendar without asking
        the user first; then insert calendar_event. If no game is in range, next_game has the next one.
      parameters:
        - {in: path, name: team_id, required: true, schema: {type: string}, description: team_id from searchTeams., example: tsl-340-744621-4306365}
        - {in: query, name: date, required: false, schema: {type: string}, description: "today, tomorrow or YYYY-MM-DD.", example: today}
        - {in: query, name: from, required: false, schema: {type: string, format: date}}
        - {in: query, name: to, required: false, schema: {type: string, format: date}, description: Range is limited to 62 days; defaults to 14 days from `from`.}
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamGamesResult"}
        "400": {description: Bad date range, content: {application/json: {schema: {$ref: "#/components/schemas/TeamsError"}}}}
        "404": {description: Unknown team_id, content: {application/json: {schema: {$ref: "#/components/schemas/TeamsError"}}}}
        "502": {description: League schedule unavailable (ask the user for a schedule link), content: {application/json: {schema: {$ref: "#/components/schemas/TeamsError"}}}}
  /v1/teams/{team_id}/calendar.ics:
    get:
      operationId: getTeamCalendar
      summary: Subscribable iCalendar feed of the team's games with play odds in each description.
      parameters:
        - {in: path, name: team_id, required: true, schema: {type: string}}
      responses:
        "200":
          description: iCalendar feed (last 7 days through the next 120 days)
          content:
            text/calendar:
              schema: {type: string}
  /v1/tracks:
    get:
      operationId: listTracks
      summary: Find a supported motocross track.
      description: >-
        Find a motocross track by name, alias or town (empty q lists the confirmed tracks). Confirm the track with the user.
        With q or state, OpenStreetMap motocross tracks nationwide are included (verification_level "osm_only": no event
        calendar or official status; check returns weather-only conditions_if_racing). If next_step is
        ask_user_for_events_url the track is not covered; ask the user for an event link.
      parameters:
        - {in: query, name: q, required: false, schema: {type: string, maxLength: 120}, example: Swan MX}
        - {in: query, name: state, required: false, schema: {type: string}, example: TX}
        - {in: query, name: verification, required: false, schema: {type: string, enum: [confirmed, osm_only, all]}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 500}}
        - {in: query, name: offset, required: false, schema: {type: integer, minimum: 0}}
      responses:
        "200": {description: Candidate tracks, content: {application/json: {schema: {$ref: "#/components/schemas/TrackList"}}}}
        "400": {description: Bad query, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
  /v1/tracks/{track_id}/events:
    get:
      operationId: getTrackEvents
      summary: Upcoming races at a track with riding odds, official status, sources and a calendar event.
      description: >-
        Events come only from public track and series calendars (never invented). Read reason aloud. Ask before any
        calendar add. If none are found, ask the user for an event link and pass events_url.
      parameters:
        - {in: path, name: track_id, required: true, schema: {type: string}, example: tyler-tx-swan-mx}
        - {in: query, name: date, required: false, schema: {type: string}, description: "today, tomorrow, saturday, sunday, this weekend or YYYY-MM-DD."}
        - {in: query, name: from, required: false, schema: {type: string, format: date}}
        - {in: query, name: to, required: false, schema: {type: string, format: date}, description: Defaults to 90 days out; max 400 days.}
        - {in: query, name: include_practice, required: false, schema: {type: boolean}}
        - {in: query, name: events_url, required: false, schema: {type: string, format: uri}, description: User-supplied event page or ICS link (public http(s) only).}
      responses:
        "200": {description: Events, content: {application/json: {schema: {$ref: "#/components/schemas/TrackEventsResult"}}}}
        "400": {description: Bad date, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
        "404": {description: Unknown track_id, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
        "502": {description: Sources or forecast unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
  /v1/tracks/{track_id}/check:
    get:
      operationId: checkRace
      summary: Chance a race at the track on a date happens, with a one-sentence reason.
      description: >-
        Combines official notices, race-window forecast, prior 24-48h rain (soaked dirt) and NOAA rain history. Read
        answer aloud; official status wins. Returns calendar_event and ics; ask before adding to a calendar.
      parameters:
        - {in: path, name: track_id, required: true, schema: {type: string}, example: swan}
        - {in: query, name: date, required: false, schema: {type: string}, example: saturday}
        - {in: query, name: event_id, required: false, schema: {type: string}, description: event_id from getTrackEvents.}
        - {in: query, name: events_url, required: false, schema: {type: string, format: uri}}
      responses:
        "200": {description: Race check, content: {application/json: {schema: {$ref: "#/components/schemas/RaceCheckResult"}}}}
        "400": {description: Missing date/event_id or bad date, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
        "404": {description: Unknown track_id, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
        "502": {description: Sources or forecast unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
  /v1/tracks/{track_id}/history:
    get:
      operationId: getTrackHistory
      summary: Monthly NOAA rain stats and documented past rain cancellations or postponements.
      description: >-
        Monthly rain frequency and climatology race odds from NOAA, plus publicly documented cancelled or moved events
        with source links. Coverage notes say what could not be read; an empty list is not proof of no rainouts.
      parameters:
        - {in: path, name: track_id, required: true, schema: {type: string}, example: freestone}
      responses:
        "200": {description: History, content: {application/json: {schema: {$ref: "#/components/schemas/TrackHistory"}}}}
        "404": {description: Unknown track_id, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
  /v1/tracks/{track_id}/calendar.ics:
    get:
      operationId: getTrackCalendar
      summary: Subscribable iCalendar feed of the track's races with riding odds in each description.
      parameters:
        - {in: path, name: track_id, required: true, schema: {type: string}}
      responses:
        "200": {description: iCalendar feed (last 7 days through the next 180 days), content: {text/calendar: {schema: {type: string}}}}
        "404": {description: Unknown track_id, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
  /v1/rain:
    get:
      operationId: getRainChance
      summary: Worldwide hourly or daily chance of rain and expected amount for a place or lat/lon.
      description: >-
        Place name (q) or lat/lon anywhere. NWS is primary in the US, Open-Meteo elsewhere and as fallback. Read
        summary aloud. If ambiguous=true, ask which of matches the user means, then retry with a state/country,
        pick or lat/lon.
      parameters:
        - {in: query, name: q, required: false, schema: {type: string, maxLength: 120}, description: "Place name or 'lat,lon'.", example: "Austin, TX"}
        - {in: query, name: lat, required: false, schema: {type: number, minimum: -90, maximum: 90}}
        - {in: query, name: lon, required: false, schema: {type: number, minimum: -180, maximum: 180}}
        - {in: query, name: hours, required: false, schema: {type: integer, minimum: 1, maximum: 384}, description: Hourly rows from now (default 24 when days and at are absent).}
        - {in: query, name: days, required: false, schema: {type: integer, minimum: 1, maximum: 16}, description: Daily rows from today.}
        - {in: query, name: at, required: false, schema: {type: string}, description: "Local time at the place (2026-10-18 19:00) or ISO with offset.", example: "2026-10-18 19:00"}
        - {in: query, name: pick, required: false, schema: {type: integer, minimum: 1, maximum: 5}, description: Choose match N from an ambiguous name.}
      responses:
        "200": {description: Forecast, or matches when the name is ambiguous, content: {application/json: {schema: {$ref: "#/components/schemas/RainResult"}}}}
        "400": {description: Bad input, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
        "404": {description: place_not_found (with suggestions), content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
        "502": {description: Weather or geocoder unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/TracksError"}}}}
components:
  schemas:
    CancellationReport:
      type: object
      properties:
        id:
          type: string
        field_id:
          type: string
        status:
          type: string
          enum: [cancelled, delayed, field_closed, playing]
        game_date:
          type: string
          description: Local date of the game at the venue (YYYY-MM-DD).
        game_time:
          type: string
        reported_at:
          type: string
        note:
          type: string
          nullable: true
    CommunityReportSummary:
      type: object
      description: Unverified user reports from the last 12 hours for the game's local date.
      properties:
        count:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        latest_reported_at:
          type: string
          nullable: true
        window_hours:
          type: integer
        game_date:
          type: string
          nullable: true
        applied:
          type: boolean
          description: True when the reports changed the play probability (only while the official status is unknown).
        adjustment_percent_points:
          type: integer
        play_probability_before_reports:
          type: integer
        reason:
          type: string
    TeamCandidate:
      type: object
      properties:
        team_id: {type: string, example: tsl-340-744621-4306365}
        name: {type: string, example: ATX Boys}
        league: {type: string, example: Capital City Softball (Austin Parks & Recreation adult softball)}
        league_id: {type: string, nullable: true}
        division: {type: string, nullable: true, example: Friday Softball 503 Men 0HR South}
        season: {type: string, nullable: true}
        sport: {type: string, nullable: true}
        day: {type: string, nullable: true}
        venue: {type: object, nullable: true, properties: {field_id: {type: string}, name: {type: string}, city: {type: string}, state: {type: string}}}
        schedule_source_url: {type: string}
        platform: {type: string, enum: [teamsideline, ambl, generic]}
        confidence: {type: number, minimum: 0, maximum: 1}
        games_url: {type: string}
    TeamSearchResult:
      type: object
      properties:
        query: {type: object}
        count: {type: integer}
        candidates: {type: array, items: {$ref: "#/components/schemas/TeamCandidate"}}
        next_step: {type: string, enum: [confirm_with_user, ask_user_for_schedule_url]}
        message: {type: string}
        searched_sources: {type: array, items: {type: object}}
        as_of: {type: string}
    CalendarEvent:
      type: object
      description: Google Calendar API event resource (events.insert / events.import body). Only add it after the user agrees.
      properties:
        summary: {type: string}
        location: {type: string, nullable: true}
        description: {type: string}
        start: {type: object, properties: {dateTime: {type: string}, timeZone: {type: string}}}
        end: {type: object, properties: {dateTime: {type: string}, timeZone: {type: string}}}
        iCalUID: {type: string, description: Stable per game, so re-adding updates instead of duplicating.}
        status: {type: string, nullable: true}
        source: {type: object, properties: {title: {type: string}, url: {type: string}}}
        reminders: {type: object}
    TeamGame:
      type: object
      properties:
        game_id: {type: string}
        team: {type: string}
        opponent: {type: string, nullable: true}
        home_away: {type: string, nullable: true, enum: [home, away]}
        start: {type: string, description: ISO-8601 with UTC offset}
        end: {type: string, nullable: true}
        end_estimated: {type: boolean}
        timezone: {type: string, example: America/Chicago}
        when_spoken: {type: string, example: tomorrow at 8:20 PM}
        venue: {type: object, nullable: true, properties: {field_id: {type: string, nullable: true}, name: {type: string}, field: {type: string, nullable: true}, address: {type: string, nullable: true}, rainout_phone: {type: string, nullable: true}}}
        league_status: {type: string, enum: [scheduled, final, cancelled, postponed, forfeit]}
        play_probability: {type: integer, nullable: true, minimum: 0, maximum: 100, description: "Chance the game is played. 100 = already played, 0 = cancelled/postponed/forfeit, null = too far out."}
        risk_level: {type: string, nullable: true}
        at_risk: {type: boolean, nullable: true}
        reason: {type: string, description: One sentence an agent can say aloud.}
        reason_detail: {type: string, nullable: true}
        weather: {type: object, nullable: true}
        status_source: {type: object, description: "league_schedule (name, url, status), official (rainout source), weather source."}
        as_of: {type: string}
        calendar_event: {$ref: "#/components/schemas/CalendarEvent"}
        ics: {type: string, description: Single-event iCalendar text.}
    TeamGamesResult:
      type: object
      properties:
        team: {$ref: "#/components/schemas/TeamCandidate"}
        range: {type: object, properties: {from: {type: string}, to: {type: string}, timezone: {type: string}}}
        count: {type: integer}
        games: {type: array, items: {$ref: "#/components/schemas/TeamGame"}}
        next_game: {allOf: [{$ref: "#/components/schemas/TeamGame"}], nullable: true}
        message: {type: string, example: "ATX Boys has no games today. Next game: tomorrow at 8:20 PM vs The Vatos."}
        calendar_ics_url: {type: string}
        calendar_policy: {type: string}
        as_of: {type: string}
    TeamsError:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
        next_step: {type: string, nullable: true}
        spoken_answer: {type: string, nullable: true}
    ScheduleGameInput:
      type: object
      properties:
        venue: {type: string, description: "Venue id, name or alias (also venue_id, field_id, field, location)"}
        start: {type: string, description: "ISO-8601; times without offset use the venue's local time (also game_time, datetime, or date + time)"}
        date: {type: string}
        time: {type: string}
        home: {type: string}
        away: {type: string}
        teams: {type: string, example: Hawks vs Bats}
        title: {type: string}
        id: {type: string}
        end: {type: string}
        timezone: {type: string}
    ScheduleGame:
      type: object
      properties:
        index: {type: integer}
        uid: {type: string}
        title: {type: string, nullable: true}
        home: {type: string, nullable: true}
        away: {type: string, nullable: true}
        start: {type: string}
        status: {type: string, enum: [evaluated, no_forecast, unmatched_venue, invalid]}
        venue:
          type: object
          nullable: true
          properties:
            field_id: {type: string}
            name: {type: string}
            city: {type: string}
            state: {type: string}
            match_method: {type: string, enum: [exact, alias_in_text, default_venue]}
        basis: {type: string, enum: ["nws_forecast", "nws_forecast+history", "open_meteo_forecast", "open_meteo_forecast+history", history_only, calendar, none]}
        weather_source: {type: string, description: "Human-readable weather source for forecast-scored games."}
        weather_source_id: {type: string, enum: [nws, nws_stale, open_meteo]}
        official_status: {type: string}
        assumes_game_scheduled: {type: boolean}
        rain_chance_percent: {type: integer, nullable: true}
        thunderstorm_likely: {type: boolean, nullable: true}
        play_probability_percent: {type: integer, nullable: true}
        risk_level: {type: string}
        at_risk: {type: boolean}
        risk_reasons: {type: array, items: {type: string}}
        recommendation: {type: string}
        reason: {type: string}
        rainout_phone: {type: string}
        official_status_source_url: {type: string, nullable: true}
        status_url: {type: string}
        historical_calibration: {type: object}
    ScheduleReport:
      type: object
      properties:
        generated_at: {type: string}
        risk_threshold_percent: {type: integer}
        window: {type: object, properties: {start: {type: string}, end: {type: string}, days: {type: integer}}}
        summary:
          type: object
          properties:
            games_in_input: {type: integer}
            games_in_window: {type: integer}
            evaluated: {type: integer}
            at_risk: {type: integer}
            unmatched_venue: {type: integer}
            with_nws_forecast: {type: integer}
            with_fallback_forecast: {type: integer, description: Games scored with the Open-Meteo fallback.}
            history_only: {type: integer}
            skipped_past: {type: integer}
            skipped_beyond_window: {type: integer}
        games: {type: array, items: {$ref: "#/components/schemas/ScheduleGame"}}
        warnings: {type: array, items: {type: string}}
        assumptions: {type: array, items: {type: string}}
    ScheduleError:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
        docs: {type: string}
    Track:
      type: object
      properties:
        track_id: {type: string, example: tyler-tx-swan-mx}
        short_id: {type: string, example: swan}
        name: {type: string, example: Swan MX}
        city: {type: string}
        state: {type: string}
        timezone: {type: string}
        website: {type: string, nullable: true}
        soil: {type: string}
        confidence: {type: number, nullable: true}
    TrackList:
      type: object
      properties:
        count: {type: integer}
        tracks: {type: array, items: {$ref: "#/components/schemas/Track"}}
        next_step: {type: string, enum: [confirm_with_user, use_track, ask_user_for_events_url]}
        message: {type: string}
    TrackEvent:
      type: object
      properties:
        event_id: {type: string, example: swan-20261016-r}
        name: {type: string}
        kind: {type: string, enum: [race, practice]}
        series: {type: string, nullable: true}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        timezone: {type: string}
        time_estimated: {type: boolean, description: True when the source gave dates but no gate times.}
        play_probability: {type: integer, nullable: true, description: Chance the event runs (0-100) on headline_date.}
        headline_date: {type: string, nullable: true}
        reason: {type: string, description: One plain sentence to read aloud.}
        official_status: {type: string, enum: [unknown, on, uncertain, postponed, cancelled]}
        status_evidence: {type: array, items: {type: object}}
        days: {type: array, items: {type: object}, description: "Per-day role (race, arrival_practice), basis (forecast, climatology, past), odds, rain inputs."}
        sources: {type: array, items: {type: object, properties: {name: {type: string}, url: {type: string}}}}
        calendar_event: {type: object, description: Google Calendar API event body with a stable iCalUID.}
        ics: {type: string}
    TrackEventsResult:
      type: object
      properties:
        track: {$ref: "#/components/schemas/Track"}
        range: {type: object}
        count: {type: integer}
        events: {type: array, items: {$ref: "#/components/schemas/TrackEvent"}}
        next_event: {allOf: [{$ref: "#/components/schemas/TrackEvent"}], nullable: true}
        next_step: {type: string}
        message: {type: string}
        sources_checked: {type: array, items: {type: object}}
        calendar_ics_url: {type: string}
        calendar_policy: {type: string}
        as_of: {type: string}
    RaceCheckResult:
      type: object
      properties:
        found: {type: boolean}
        answer: {type: string}
        event: {allOf: [{$ref: "#/components/schemas/TrackEvent"}], nullable: true}
        next_event: {allOf: [{$ref: "#/components/schemas/TrackEvent"}], nullable: true}
        next_step: {type: string, enum: [offer_calendar_add, tell_user_cancelled, ask_user_for_events_url]}
        track: {$ref: "#/components/schemas/Track"}
        sources_checked: {type: array, items: {type: object}}
        calendar_policy: {type: string}
        as_of: {type: string}
    TrackHistory:
      type: object
      properties:
        track: {$ref: "#/components/schemas/Track"}
        noaa_rain_history: {type: object, description: "Station, period, monthly table (mean rain, rainy-day %, inch-day %, climatology_race_odds), wettest months, recent inch-plus days."}
        documented_events: {type: array, items: {type: object}, description: "Each with date, event, kind, outcome, cause, source_url, and noaa_observed rain around the date."}
        summary: {type: object}
        coverage: {type: object}
        as_of: {type: string}
    TracksError:
      type: object
      properties:
        error: {type: string}
        message: {type: string}
        next_step: {type: string}
        spoken_answer: {type: string}
        docs: {type: string}
    RainHour:
      type: object
      properties:
        time: {type: string, description: Local ISO time at the place.}
        probability_percent: {type: integer}
        precip_mm: {type: number, nullable: true}
        precip_in: {type: number, nullable: true}
        weather: {type: string, nullable: true}
        probability_source: {type: string, enum: [nws, open_meteo]}
    RainDay:
      type: object
      properties:
        date: {type: string, format: date}
        weekday: {type: string}
        max_probability_percent: {type: integer}
        precip_mm: {type: number, nullable: true}
        precip_in: {type: number, nullable: true}
        weather: {type: string, nullable: true}
        probability_source: {type: string, enum: [nws, open_meteo]}
    RainResult:
      type: object
      properties:
        query: {type: string}
        ambiguous: {type: boolean}
        matches: {type: array, items: {type: object}, description: Present when ambiguous.}
        next_step: {type: string, enum: [ask_user_which_place]}
        place: {type: object, properties: {label: {type: string}, latitude: {type: number}, longitude: {type: number}, timezone: {type: string}, country_code: {type: string, nullable: true}, in_nws_coverage: {type: boolean}}}
        timezone: {type: string}
        units: {type: string, enum: [in, mm], description: Units used in summary; both are in the rows.}
        source: {type: object, properties: {probability: {type: string}, amounts: {type: string}, nws_used: {type: boolean}, attribution: {type: string}}}
        hourly: {type: array, items: {$ref: "#/components/schemas/RainHour"}}
        daily: {type: array, items: {$ref: "#/components/schemas/RainDay"}}
        at: {allOf: [{$ref: "#/components/schemas/RainHour"}], nullable: true}
        summary: {type: string, description: One plain sentence to read aloud.}
        other_matches: {type: array, items: {type: string}}
        as_of: {type: string}
